<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订货通 - 商城</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
            color: #333;
        }

        /* ========== 最左侧：应用导航 ========== */
        .app-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 48px;
            background-color: #001529;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            color: #fff;
            z-index: 1000;
        }

        .app-logo {
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            color: #001529;
            font-weight: bold;
        }

        .app-nav {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
            flex: 1;
        }

        .app-nav-item {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            color: #aaa;
        }

        .app-nav-item.active {
            background-color: #1890ff;
            color: #fff;
        }

        /* ========== 顶部导航 ========== */
        .top-header {
            position: fixed;
            top: 0;
            left: 48px;
            right: 0;
            height: 44px;
            background: linear-gradient(to right, #e0f2ff, #ffffff);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 999;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #555;
        }

        /* ========== 主体布局 ========== */
        .main-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
            margin-top: 44px;
            margin-left: 48px;
        }

        /* ========== 左侧：订货通菜单 ========== */
        .sidebar {
            width: 200px;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            padding: 16px 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 0 16px;
        }

        .sidebar-logo {
            width: 32px;
            height: 32px;
            background-color: #52c41a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px 16px;
        }

        .search-input {
            flex: 1;
            height: 32px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 14px;
        }

        .add-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 16px;
        }

        .menu-list {
            list-style: none;
            flex: 1;
            overflow-y: auto;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 0 6px 6px 0;
            margin-bottom: 4px;
            position: relative;
            font-size: 14px;
        }

        .menu-item.active {
            background-color: #fff7e6;
            color: #ff7d00;
        }

        .menu-item .badge {
            position: absolute;
            right: 16px;
            background-color: #ff4d4f;
            color: white;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 10px;
        }

        .submenu-title {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            color: #666;
            font-size: 14px;
        }

        /* ========== 主内容区 ========== */
        .content-page {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        /* 顶部工具栏 */
        .top-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .toolbar-title {
            font-size: 14px;
            font-weight: 500;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #666;
            cursor: pointer;
            font-size: 12px;
        }

        /* 商品分类标签 */
        .category-tabs {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
            background-color: white;
            padding: 12px 16px;
            border-radius: 8px;
        }

        .tab-item {
            padding: 4px 0;
            cursor: pointer;
            color: #666;
        }

        .tab-item.active {
            color: #ff7d00;
            font-weight: 500;
        }

        /* 筛选工具栏 */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .filter-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
        }

        .filter-search {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: white;
            padding: 0 8px;
        }

        .filter-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .view-switch {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sort-select {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* 商品网格 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .product-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .product-image {
            width: 100%;
            height: 200px;
            background-color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d1d5db;
            font-size: 48px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 12px;
        }

        .product-name {
            font-size: 14px;
            margin-bottom: 8px;
            color: #333;
        }

        .product-price {
            font-size: 16px;
            font-weight: 600;
            color: #ff4d4f;
            margin-bottom: 4px;
        }

        .product-tag {
            font-size: 12px;
            color: #52c41a;
        }
    </style>
</head>
<body>

<!-- 最左侧：应用导航 -->
<div class="app-sidebar">
    <div class="app-logo">企</div>
    <div class="app-nav">
        <div class="app-nav-item">🏠</div>
        <div class="app-nav-item active">📦</div>
        <div class="app-nav-item">🔔</div>
        <div class="app-nav-item">👤</div>
    </div>
</div>

<!-- 顶部导航 -->
<div class="top-header">
    <div class="header-left">内测企业fktest4989-多级订货</div>
    <div class="header-right">
        <div class="header-icon">❔</div>
        <div class="header-icon">👤</div>
    </div>
</div>

<!-- 主体布局 -->
<div class="main-container">
    <!-- 左侧：订货通菜单 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">🛒</div>
            <div class="sidebar-title">订货通</div>
        </div>
        <div class="search-bar">
            <input class="search-input" placeholder="搜索">
            <button class="add-btn">+</button>
        </div>
        <ul class="menu-list">
            <li class="menu-item">🏠 首页</li>
            <li class="menu-item">✅ 待办事项 <span class="badge">①</span></li>
            <li class="menu-item">🔔 业务通知</li>
            <li class="submenu-title">▾ 在线订货</li>
            <li class="menu-item active">🛒 商城</li>
            <li class="menu-item">💴 回款</li>
            <li class="menu-item">🛒 购物车</li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="content-page">
        <!-- 顶部工具栏 -->
        <div class="top-toolbar">
            <div class="toolbar-left">
                <div class="toolbar-title">工具</div>
            </div>
            <div class="toolbar-right">
                <div class="tool-btn">📄 草稿箱</div>
                <div class="tool-btn">👥 线上客服</div>
                <div class="tool-btn">🛒 购物车</div>
            </div>
        </div>

        <!-- 商品分类标签 -->
        <div class="category-tabs">
            <div class="tab-item active">全部商品</div>
            <div class="tab-item">整机</div>
            <div class="tab-item">配件</div>
            <div class="tab-item">新品上架</div>
            <div class="tab-item">收藏商品</div>
            <div class="tab-item">促销商品</div>
        </div>

        <!-- 筛选工具栏 -->
        <div class="filter-bar">
            <div class="filter-left">
                <div class="filter-btn">☷ 产品分类</div>
                <button class="filter-btn">筛选</button>
                <div class="filter-search">
                    <span>产品名称 ▾</span>
                    <input type="text" placeholder="搜索" style="border: none; outline: none; padding: 4px;">
                    <span>🔍</span>
                </div>
            </div>
            <div class="filter-right">
                <div class="view-switch">
                    <div class="view-btn">☷</div>
                    <div class="view-btn">▢</div>
                    <div class="view-btn">▢</div>
                </div>
                <div class="sort-select">
                    <span>排序:</span>
                    <span>创建时间 ▾</span>
                </div>
                <div class="view-btn">⚙️</div>
                <div class="view-btn">⟳</div>
            </div>
        </div>

        <!-- 商品网格 -->
        <div class="product-grid">
            <!-- 商品1 -->
            <div class="product-card">
                <div class="product-image">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <path d="M21 15l-5-5L5 21"></path>
                    </svg>
                </div>
                <div class="product-info">
                    <div class="product-name">T1自营商品-自营配件</div>
                    <div class="product-price">¥12.00<span style="font-size:12px; font-weight:normal; color:#666;">/只</span></div>
                    <div class="product-tag">新品</div>
                </div>
            </div>
            <!-- 商品2 -->
            <div class="product-card">
                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=300&h=200&fit=crop" alt="烹饪机器人">
                </div>
                <div class="product-info">
                    <div class="product-name">烹饪机器人</div>
                    <div class="product-price">¥69999.00<span style="font-size:12px; font-weight:normal; color:#666;">/</span></div>
                    <div style="display:flex; gap:8px;">
                        <div class="product-tag">新品</div>
                        <div class="product-tag" style="color: #ff4d4f;">热销</div>
                    </div>
                </div>
            </div>
            <!-- 商品3 -->
            <div class="product-card">
                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1594925764518-78d01423d66c?w=300&h=200&fit=crop" alt="金宇轮胎">
                </div>
                <div class="product-info">
                    <div class="product-name">金宇轮胎 11R22.5</div>
                    <div class="product-price">¥125.00<span style="font-size:12px; font-weight:normal; color:#666;">/条</span></div>
                </div>
            </div>
            <!-- 商品4 -->
            <div class="product-card">
                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1594925764518-78d01423d66c?w=300&h=200&fit=crop" alt="黑狮轮胎">
                </div>
                <div class="product-info">
                    <div class="product-name">黑狮轮胎 295/80R22.5</div>
                    <div class="product-price">¥300.00<span style="font-size:12px; font-weight:normal; color:#666;">/条</span></div>
                    <div class="product-tag">新品</div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
